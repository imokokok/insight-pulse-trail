name: Insight Pulse Trail — 15min

on:
  schedule:
    # Every 15 minutes, GitHub UTC
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write

jobs:
  emit-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --include=dev || npm install

      - name: Run Pulse sampler
        id: pulse
        env:
          PULSE_SAMPLE_PRIVATE_KEY: ${{ secrets.PULSE_SAMPLE_PRIVATE_KEY }}
          PULSE_SYMBOL: 'ETH'
        run: node scripts/pulse.mjs

      - name: Commit & push
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "Insight Pulse Bot"
          git config user.email "pulse@oracleinsight.xyz"

          git add -A
          git add -f pulses/  # .gitignore'd — force-add the Pulse JSON
          if ! git diff --cached --quiet; then
            git commit -m "📡 Pulse ${{ steps.pulse.outputs.symbol }} consensus=\$${{ steps.pulse.outputs.consensus }} score=${{ steps.pulse.outputs.score }} dev=${{ steps.pulse.outputs.dev }}bps uid=${{ steps.pulse.outputs.uid }} attester=${{ steps.pulse.outputs.attester }} — ${{ steps.pulse.outputs.file }}"
            git push origin HEAD
          else
            echo "No changes to commit"
          fi
